name: Docker (Worker)

# The paths list OMITS `api/**`. Exactly ONE sibling lists it -
# administrative-document - and it is the one that needs it: its scheduled
# sweeps construct the real HTTP service class, which lives under api/, so its
# Dockerfile.worker copies api/ in. (billing, simulation-key and
# allocation-key-generation list no `api/**` either; this is not a divergence
# from the house, only from that one repo.)
#
# live-data's worker ingests MQTT into its own tables and has no such need, so
# Dockerfile.worker has no `COPY api/ api/` - and
# tests/test_worker_import_graph.py asserts that every first-party package the
# worker imports appears in that COPY list.
#
# Listing api/** here would rebuild the worker image on changes that cannot
# reach it, and would quietly suggest that api/ is part of the worker. It is
# not, and keeping it out is what makes the whole "worker image has no fastapi"
# failure class structural rather than mitigated.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile.worker'
      - 'core/**'
      - 'domain/**'
      - 'ports/**'
      - 'shared/**'
      - 'worker/**'
      - 'locales/**'
      - 'requirements/base.txt'
      - 'requirements/worker.txt'
      - '.dockerignore'
      - '.github/workflows/build-worker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.worker'
      - 'core/**'
      - 'domain/**'
      - 'ports/**'
      - 'shared/**'
      - 'worker/**'
      - 'locales/**'
      - 'requirements/base.txt'
      - 'requirements/worker.txt'
      - '.dockerignore'
      - '.github/workflows/build-worker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-worker,onlatest=true

      - name: Build and push (worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
